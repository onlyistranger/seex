[package]
name = "happyjlc-core"
version = "0.1.0"
edition = "2024"
authors = ["Alddp"]
publish = false
description = "Fast and reliable EasyEDA/LCSC to KiCad converter with batch processing support"
license = "CC-BY-NC-4.0"
repository = "https://github.com/Alddp/happyjlc"
homepage = "https://github.com/Alddp/happyjlc"
documentation = "https://github.com/Alddp/happyjlc"
readme = "README.md"
keywords = ["kicad", "easyeda", "lcsc", "eda", "converter"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "happyjlc_core"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13.2", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.3"
thiserror = "2.0.18"
anyhow = "1.0.102"
log = "0.4.29"
tokio = { version = "1.52.1", features = ["full"] }
futures-util = "0.3.32"

[dev-dependencies]
mockito = "1.7.2"
