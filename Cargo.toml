[workspace]
members = [
    "crates/core",
    "crates/cli",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Alddp"]
license = "CC-BY-NC-4.0"
repository = "https://github.com/Alddp/happyjlc"
homepage = "https://github.com/Alddp/happyjlc"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
regex = "1.12.3"
log = "0.4.29"
tokio = "1.52.1"
chrono = "0.4.44"
