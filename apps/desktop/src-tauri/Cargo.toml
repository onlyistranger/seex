[package]
name = "happyjlc-desktop"
version = "0.1.0"
authors = ["Alddp"]
edition = "2024"
default-run = "happyjlc-desktop"
publish = false
license = "CC-BY-NC-4.0"
repository = "https://github.com/Alddp/happyjlc"
homepage = "https://github.com/Alddp/happyjlc"
description = "HappyJLC Tauri desktop application"
readme = "../../../README.md"

[lib]
name = "happyjlc_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
happyjlc-core = { path = "../../../crates/core" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
csv = "1.3.1"
arboard = "3.6.1"
clipboard-master = "4.0.0"
chrono = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
