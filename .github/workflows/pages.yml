name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
      - mod
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - name: Build WebAssembly (seex-wasm)
        run: cargo build --release --manifest-path crates/seex-wasm/Cargo.toml --target wasm32-unknown-unknown

      - name: Prepare Pages Artifacts
        run: |
          mkdir -p dist/wasm
          cp crates/seex-wasm/target/wasm32-unknown-unknown/release/seex_wasm.wasm dist/wasm/
          cp crates/seex-wasm/web/seex.js dist/wasm/
          cp crates/seex-wasm/web/index.html dist/wasm/
          touch dist/wasm/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/wasm
          publish_branch: gh-pages
          force_orphan: true
